<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifecare Hospital - Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            background:linear-gradient(135deg, #0f3460 0%, #16213e 50%, #0f5438 100%);
            position:relative;
            overflow:hidden;
        }

        .medical-bg{
            position:absolute;
            width:100%;
            height:100%;
            top:0;
            left:0;
            z-index:0;
        }

        .pulse-circle{
            position:absolute;
            border:2px solid rgba(76,175,80,0.3);
            border-radius:50%;
            animation:pulse-expand 3s infinite ease-out;
        }

        .pulse-circle:nth-child(1){
            width:150px;
            height:150px;
            top:20%;
            right:10%;
            animation-delay:0s;
        }

        .pulse-circle:nth-child(2){
            width:120px;
            height:120px;
            bottom:15%;
            left:8%;
            animation-delay:1s;
        }

        @keyframes pulse-expand{
            0%{
                transform:scale(1);
                opacity:1;
            }
            100%{
                transform:scale(2);
                opacity:0;
            }
        }

        .floating-icon{
            position:absolute;
            font-size:3rem;
            opacity:0.15;
            animation:float 6s infinite ease-in-out;
        }

        .floating-icon:nth-child(3){
            top:10%;
            right:5%;
            color:#4caf50;
            animation-delay:0s;
        }

        .floating-icon:nth-child(4){
            bottom:20%;
            left:5%;
            color:#ff6b6b;
            animation-delay:2s;
        }

        .floating-icon.icon-stethoscope,
        .floating-icon.icon-syringe{
            cursor:pointer;
            opacity:0.22;
        }

        .floating-icon.icon-syringe{
            top:18%;
            left:12%;
            color:#86efac;
            animation-delay:1.5s;
        }

        @keyframes float{
            0%, 100%{
                transform:translateY(0px) rotate(0deg);
            }
            50%{
                transform:translateY(-30px) rotate(5deg);
            }
        }

        .touch-panel{
            width:100%;
            max-width:500px;
            margin-bottom:18px;
            padding:18px 22px;
            border-radius:26px;
            background:rgba(255,255,255,0.92);
            border:1px solid rgba(76,175,80,0.18);
            box-shadow:0 24px 60px rgba(0,0,0,0.12);
            position:relative;
            z-index:10;
            text-align:center;
        }

        .touch-panel h3{
            font-size:1rem;
            color:#0f5438;
            margin-bottom:12px;
        }

        .touch-buttons{
            display:flex;
            justify-content:center;
            gap:18px;
            flex-wrap:wrap;
        }

        .touch-button{
            width:68px;
            height:68px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:20px;
            background:rgba(76,175,80,0.12);
            color:#0f5438;
            cursor:pointer;
            transition:transform 0.25s ease, background 0.25s ease;
            font-size:1.6rem;
        }

        .touch-button:hover{
            transform:translateY(-2px);
            background:rgba(76,175,80,0.2);
        }

        .touch-button.active{
            background:linear-gradient(135deg,#4caf50,#45a049);
            color:#fff;
        }

        .hint-box{
            opacity:0;
            max-height:0;
            overflow:hidden;
            transition:all 0.3s ease;
            margin-top:14px;
        }

        .hint-box.visible{
            opacity:1;
            max-height:180px;
        }

        .hint-box p{
            color:#334155;
            line-height:1.6;
            font-size:0.95rem;
            margin-bottom:12px;
        }

        .hint-box .hint-detail{
            display:flex;
            justify-content:space-between;
            gap:10px;
            background:rgba(76,175,80,0.08);
            padding:12px 14px;
            border-radius:14px;
            font-weight:600;
            color:#0f5438;
        }

        .hint-box .hint-detail span{
            width:50%;
            text-align:left;
        }

        .form-card{
            width:100%;
            max-width:500px;
            padding:44px 38px;
            border-radius:28px;
            background:rgba(255,255,255,0.98);
            box-shadow:0 30px 100px rgba(0,0,0,0.3);
            backdrop-filter:blur(14px);
            position:relative;
            z-index:10;
            border:1px solid rgba(255,255,255,0.2);
            animation:slideUp 0.6s ease-out;
        }

        @keyframes slideUp{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .form-card h2{
            margin-bottom:28px;
            color:#0f5438;
            font-size:2rem;
            text-align:center;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:12px;
            animation:heartBeat 1.5s infinite;
        }

        .form-card h2 i{
            animation:heartPulse 1.5s infinite;
        }

        @keyframes heartBeat{
            0%, 100%{transform:scale(1);}
            25%{transform:scale(1.05);}
            50%{transform:scale(1);}
        }

        @keyframes heartPulse{
            0%, 100%{color:#0f5438; transform:scale(1);}
            25%{color:#ff6b6b; transform:scale(1.2);}
            50%{color:#ff6b6b; transform:scale(1.1);}
        }

        .input-group{
            position:relative;
            margin-bottom:20px;
        }

        .input-group input{
            width:100%;
            padding:14px 44px;
            border:2px solid #e0e0e0;
            border-radius:999px;
            outline:none;
            transition:all 0.3s ease;
            font-size:1rem;
            background:#f8f9fa;
        }

        .input-group input:focus{
            border-color:#4caf50;
            background:#fff;
            box-shadow:0 0 25px rgba(76,175,80,0.25);
        }

        .input-group input::placeholder{
            color:#999;
        }

        .input-group i{
            position:absolute;
            left:16px;
            top:50%;
            transform:translateY(-50%);
            color:#4caf50;
            transition:all 0.3s ease;
        }

        .input-group input:focus ~ i{
            color:#ff6b6b;
            transform:translateY(-50%) scale(1.2);
        }

        .button-primary{
            width:100%;
            padding:14px;
            border:none;
            border-radius:999px;
            background:linear-gradient(90deg,#4caf50,#45a049);
            color:#fff;
            font-weight:700;
            cursor:pointer;
            transition:all 0.3s ease;
            position:relative;
            overflow:hidden;
        }

        .button-primary::before{
            content:'';
            position:absolute;
            top:0;
            left:-100%;
            width:100%;
            height:100%;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation:shine 3s infinite;
        }

        @keyframes shine{
            0%{left:-100%;}
            50%{left:100%;}
            100%{left:100%;}
        }

        .button-primary:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(76,175,80,0.4);
            filter:brightness(1.1);
        }

        .button-primary:active{
            transform:translateY(0);
        }

        .text-muted{
            color:#666;
            font-size:0.9rem;
            line-height:1.5;
            text-align:center;
            margin-top:18px;
            animation:fadeIn 0.8s ease-out 0.3s both;
        }

        .footer-text{
            margin-top:22px;
            text-align:center;
            font-size:0.96rem;
            color:#334155;
        }

        .footer-text a{
            color:#4caf50;
            text-decoration:none;
            font-weight:600;
            transition:all 0.3s ease;
        }

        .footer-text a:hover{
            color:#ff6b6b;
            text-decoration:underline;
        }

        @keyframes fadeIn{
            from{opacity:0;}
            to{opacity:1;}
        }
    </style>
</head>
<body>

<div class="medical-bg">
    <div class="pulse-circle"></div>
    <div class="pulse-circle"></div>
    <i class="fa-solid fa-heartbeat floating-icon"></i>
    <i class="fa-solid fa-stethoscope floating-icon icon-stethoscope" data-type="stethoscope"></i>
    <i class="fa-solid fa-syringe floating-icon icon-syringe" data-type="syringe"></i>
</div>

<div class="touch-panel" id="registerTouchPanel">
    <h3>Touch the floating injection or stethoscope to reveal registration tips</h3>
    <div class="touch-buttons">
        <div class="touch-button" data-type="syringe"><i class="fa-solid fa-syringe"></i></div>
        <div class="touch-button" data-type="stethoscope"><i class="fa-solid fa-stethoscope"></i></div>
    </div>
    <div class="hint-box" id="registerHintBox">
        <p id="registerHintText">Select an icon to see a registration suggestion.</p>
        <div class="hint-detail">
            <span id="registerHintLeft">Email</span>
            <span id="registerHintRight">Password</span>
        </div>
    </div>
</div>

<div class="form-card">
    <h2><i class="fa-solid fa-hospital"></i> Lifecare Register</h2>

    <form action="#" method="POST">
        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="password_confirmation" placeholder="Confirm Password" required>
        </div>

        <button type="submit" class="button-primary">Create Account</button>
    </form>

    <p class="text-muted">This is a static registration demo page. The form is styled for the client view.</p>

    <p class="footer-text">
        Already have an account? <a href="login.html">Login Here</a>
    </p>
</div>

<script>
    const registerTouchPanel = document.getElementById('registerTouchPanel');
    const registerHintBox = document.getElementById('registerHintBox');
    const registerHintText = document.getElementById('registerHintText');
    const registerButtons = registerTouchPanel.querySelectorAll('.touch-button');

    registerButtons.forEach(button => {
        button.addEventListener('click', () => {
            revealRegisterHint(button.dataset.type, button);
        });
    });

    const registerFloatingIcons = document.querySelectorAll('.medical-bg .floating-icon[data-type]');
    registerFloatingIcons.forEach(icon => {
        icon.addEventListener('click', () => {
            const type = icon.dataset.type;
            const matchingButton = Array.from(registerButtons).find(btn => btn.dataset.type === type);
            revealRegisterHint(type, matchingButton || icon);
        });
    });

    function revealRegisterHint(type, activeElement) {
        registerButtons.forEach(btn => btn.classList.remove('active'));
        if (activeElement && activeElement.classList) {
            activeElement.classList.add('active');
        }
        registerHintBox.classList.add('visible');
        if (type === 'syringe') {
            registerHintText.textContent = 'Injection touched — use a strong password and a real email.';
            document.getElementById('registerHintLeft').textContent = 'Valid Email';
            document.getElementById('registerHintRight').textContent = 'Strong Password';
        } else {
            registerHintText.textContent = 'Stethoscope touched — fill your details carefully and confirm password.';
            document.getElementById('registerHintLeft').textContent = 'Username';
            document.getElementById('registerHintRight').textContent = 'Confirm Pass';
        }
    }
</script>
</body>
</html>
